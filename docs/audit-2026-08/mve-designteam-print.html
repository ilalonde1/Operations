<style>
  /* Page-specific print density only — no brand changes. This is a briefing
     document read in one sitting, not a handbook, so it prints tighter than
     the reference and keeps the hero key-figures the reference hides. */
  @media print {
    html { font-size: 13.6px; }
    /* The reference sets body{font-size:17px} in absolute px, so its own
       html{font-size:15px} print rule never reaches the body text.
       Sizes raised ~12% on 2026-08-28: at the previous scale the contents index
       printed at 8.6pt and its title at 6.3pt, which needed 150% zoom to read.
       Everything a reader actually reads is now >= 9pt. */
    body { font-size: 11.6pt; line-height: 1.5; }
    .hero { padding: 11mm 14mm 8mm; }
    .hero h1 { font-size: 23pt; }
    .hero__lede { font-size: 11.6pt; }
    .hero__meta { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; font-size: 9.2pt; }

    /* Headings must fill the same measure the body text does.
       The reference sets `text-wrap: balance` on h1/h2. Balance equalises LINE
       LENGTH, so a two-line heading is squeezed to two short lines well inside
       the column while the paragraph beneath it runs to the full width — the
       heading reads as broken even though the break point is legal. It also
       chooses those breaks by length alone, so it will split after a
       preposition or an article ("the same measurement in / Raleigh",
       "design-build is taking the / market").
       `pretty` keeps the orphan protection and drops the equal-length rule. */
    h1, h2, h3, .hero h1 { text-wrap: pretty; }

    /* #facts starts on a fresh page, so whatever is left of the section before
       it sits alone. Keep the closing paragraph and its citation with the
       table above them rather than letting two lines orphan onto a page of
       their own. Same fault, same cure, as the facts sheet's own last line. */
    #signal > p:last-of-type,
    #signal > p:nth-last-of-type(2) { break-before: avoid; }
    #signal { break-after: avoid; }

    /* The openings chart is the deliverable and it is SEVEN columns, so the
       default even split wraps "Resort condominium & condo-hotel" onto three
       lines and makes a clean chart look cramped. Set the widths explicitly,
       give the wordy column the room, and stop the short factual columns from
       breaking mid-value. */
    #openings table { font-size: 8.6pt; table-layout: fixed; width: 100%; }
    #openings td, #openings th { padding: .30rem .40rem; vertical-align: top; }
    #openings th:nth-child(1), #openings td:nth-child(1) { width: 3%; }
    #openings th:nth-child(2), #openings td:nth-child(2) { width: 21%; }
    #openings th:nth-child(3), #openings td:nth-child(3) { width: 10%; }
    #openings th:nth-child(4), #openings td:nth-child(4) { width: 24%; }
    #openings th:nth-child(5), #openings td:nth-child(5) { width: 13%; }
    #openings th:nth-child(6), #openings td:nth-child(6) { width: 15%; }
    #openings th:nth-child(7), #openings td:nth-child(7) { width: 14%; }
    #openings td:nth-child(5), #openings td:nth-child(6) { hyphens: none; }
    #openings tbody tr { break-inside: avoid; }

    /* ⛔ NO FORCED PAGE BREAKS IN THIS DOCUMENT. IT COST FOUR ROUNDS TO LEARN.
       #facts was written as a one-page reference sheet: break-before AND
       break-after, with the table held whole. Every variant stranded one or two
       lines on a page of their own -- first Miami's row, then a closing note,
       then the section before it, then the section after it. Trimming copy
       three times moved the gap without closing it, because a forced break in a
       flowing document always creates a gap somewhere.

       Only "avoid" rules remain. They pull content together; "page" rules push
       it apart. Rows and boxes stay whole, headings keep their kicker, and the
       document sets 9 pages with no sparse ones. */
    #facts tbody tr { break-inside: avoid; }
    #facts > p:last-of-type { break-before: avoid; }
    #facts table { font-size: 8.1pt; }
    #facts td, #facts th { padding: .26rem .44rem; }
    #facts .lede { font-size: 10.4pt; }
    #facts .box p { font-size: 9.6pt; }

    /* Let long tables flow across a page break.
       The reference sets `table, .table-wrap { break-inside: avoid }`, which is
       right for a four-row table and wrong for a twelve-row one: a table that
       does not fit in the space left is pushed WHOLE to the next page, and the
       quarter-page it left behind stays empty. That is what put a blank band at
       the foot of pages 3 and 4 and is why the document ran to sixteen pages.
       Rows still never split, and the header repeats on each continuation. */
    table, .table-wrap { break-inside: auto; }
    tr, thead, tbody tr { break-inside: avoid; }
    thead { display: table-header-group; }
    /* Boxes stay whole -- they are short, and a callout split across a page
       break reads as two different callouts. */
    .box { break-inside: avoid; }

    /* The contents index — sized explicitly, not left to inherit a rem scale. */
    .toc__title { font-size: 8.4pt; }
    .toc a { font-size: 11pt; line-height: 1.4; padding: .30rem 0 .30rem .7rem; }
    .shell { padding: 0 14mm; }
    main { padding: 4mm 0 0; }

    /* Fill the printed column.
       The reference constrains every text block to --maxread (44rem), a measure
       chosen for the SCREEN layout, where a 15rem table-of-contents column sits
       beside the text. In print the contents becomes a page-1 index and .shell
       goes full width — but --maxread does not change, so the text keeps its
       narrow screen measure and the leftover becomes a dead band on the RIGHT:
       measured 11.6% left margin against 33.8% right on the first build.
       Letting the measure follow its container restores symmetry. */
    :root { --maxread: 100%; }
    section { margin-bottom: 0; }
    h2 { margin-top: 1.1rem; }
    .box { padding: .7rem .9rem; margin: .7rem 0; }
    .table-wrap { margin: .6rem 0; }
    table { font-size: 9.6pt; }
    th { font-size: 8.6pt; }
    .flow__step p { font-size: 9.6pt; }
    .box p { font-size: 11pt; }
    .box__label { font-size: 8.6pt; }
    .kicker { font-size: 8.6pt; }
    footer, footer p { font-size: 9.4pt; }
    .path { font-size: 8.8pt; }
    /* The reference keeps h2 with what follows but lets the kicker above it
       orphan at a page foot. Bind the kicker to its heading. */
    .kicker { break-after: avoid; }
    footer { margin-top: 1rem; break-before: avoid; }
  }

  /* Secondary detail inside a table cell — the project's size and storeys sit
     under its name so the Structural column keeps its width. Uses the existing
     ink token; no new colour is introduced. */
  .muted { color: var(--ink-faint); font-size: 0.88em; }
</style>

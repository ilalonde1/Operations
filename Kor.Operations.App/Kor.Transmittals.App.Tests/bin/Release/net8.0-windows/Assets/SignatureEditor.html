<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Email Signature Editor</title>

    <!-- TinyMCE from CDN -->
    <script src="tinymce/tinymce.min.js" referrerpolicy="origin"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        }

        #editor {
            height: 100%;
        }
    </style>
</head>
<body>
    <textarea id="editor"></textarea>

    <script>
        // Holds the latest signature content while editor boots
        window.initialSignatureHtml = "";

        // Keep a reference to the TinyMCE editor instance
        window.__signatureEditor = null;

        tinymce.init({
            selector: '#editor',
            height: 260,
            menubar: false,
            plugins: 'link lists image',
            toolbar: 'bold italic underline | forecolor backcolor | bullist numlist | link image | removeformat',
            branding: false,
            license_key: 'gpl',
            paste_data_images: true,      // allow pasted images (inline base64)
            default_link_target: '_blank',
            convert_urls: false,
            setup: function (editor) {
                window.__signatureEditor = editor;

                editor.on('init', function () {
                    if (window.initialSignatureHtml) {
                        editor.setContent(window.initialSignatureHtml);
                    }
                });
            }
        });

        // Called from WPF to push current HTML into the editor
        window.setSignatureHtml = function (html) {
            window.initialSignatureHtml = html || "";
            if (window.__signatureEditor) {
                window.__signatureEditor.setContent(window.initialSignatureHtml);
            }
        };

        // Called from WPF to read HTML from the editor
        window.getSignatureHtml = function () {
            if (window.__signatureEditor) {
                return window.__signatureEditor.getContent();
            }
            return window.initialSignatureHtml || "";
        };
    </script>
</body>
</html>
